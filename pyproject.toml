[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "control-panel-terminal"
version = "0.0.1"
description = ""
authors = [
    { name = "Dachboden", email = "info@dachboden.berlin" }
]
requires-python = ">=3.12"
dependencies = [
    "pygame-ce",
    "pyftdi",
    "moderngl",
    "numpy-quaternion",
    "numpy-stl",
    "opencv-python"
]

[tool.setuptools.packages.find]
exclude = []

[tool.setuptools.package-data]
"gui.media" = ["*.ttf", "*.png", "*.jpg", "*.stl", "*.txt",]
